name: CI

on:
  push:
    branches: ["main", "v5-nano-vm"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ruff pytest

      - name: Run Ruff linter
        run: ruff check app.py

      - name: Run pytest
        run: pytest tests/ -v
